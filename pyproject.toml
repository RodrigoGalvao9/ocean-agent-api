[project]
name = "ocean-agent-api"
version = "0.1.0"
description = "Backend for AI agent orchestration and MCP communication"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "httpx>=0.28,<1",
  "structlog>=24.4,<26",
  "langchain-core>=0.3.28,<1",
  "langchain-groq>=0.2.3,<1",
  "langgraph>=0.2.60,<1",
  "mcp>=1.23,<2",
]

[project.optional-dependencies]
test = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
