[project]
name = "ocean-agent-api"
version = "0.1.0"
description = "Backend for AI agent orchestration and MCP communication"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "httpx>=0.28,<1",
  "structlog>=24.4,<26",
  "langchain-core>=0.3.28,<1",
  "langchain-groq>=0.2.3,<1",
  "langgraph>=0.2.60,<1",
  "mcp>=1.23,<2",
  "redis>=5,<6",
  "arq>=0.26,<1",
  "prometheus-client>=0.20,<1",
  # langfuse 5.x exige langchain-core>=1; mantemos 4.x enquanto o projeto usa langchain-core 0.3.
  "langfuse>=4,<5",
  "langchain>=0.3,<1",
]

[project.optional-dependencies]
test = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "fakeredis>=2.26,<3",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
