[project]
name = "ocean-agent-api"
version = "0.1.0"
description = "Backend for AI agent orchestration and MCP communication"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "httpx>=0.28,<1",
  "structlog>=24.4,<26",
  "langchain-core>=1.8.4,<2",
  "langchain-groq>=1.2.1,<2",
  "langchain-openai>=1.8.5,<2",
  "langchain-text-splitters>=1.2,<2",
  "langgraph>=1.2.24,<2",
  "mcp>=1.23,<2",
  "redis>=5,<9",
  "arq>=0.26,<1",
  "prometheus-client>=0.20,<1",
  "langfuse>=5.2,<6",
  "langchain>=1.3.9,<2",
]

[project.optional-dependencies]
test = [
  "pytest>=9.0.3,<10",
  "pytest-asyncio>=1.5,<2",
  "fakeredis>=2.26,<3",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
